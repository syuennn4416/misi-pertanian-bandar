function freshProgress(mode='kendiri'){return {version:2,started:false,scene:'map',visited:[],notes:[],badges:[],stamps:[],answers:[],drafts:{},hints:[],inspected:[[],[],[],[]],summarySeen:false,assembly:[],simulationSeen:false,mode,vol:{voice:.8,music:.15,sfx:.5},muted:false};}
function normalizeProgress(raw,mode='kendiri'){
 const base=freshProgress(mode);if(!raw||typeof raw!=='object')return base;
 for(const k of ['visited','notes','badges','stamps','answers','hints','assembly'])if(Array.isArray(raw[k]))base[k]=raw[k];
 base.badges=[...new Set(base.badges.filter(n=>[1,2,3].includes(n)))];
 base.assembly=[...new Set(base.assembly.filter(n=>['level','inlet','capillary'].includes(n)))];
 base.inspected=base.inspected.map((_,i)=>Array.isArray(raw.inspected?.[i])?[...new Set(raw.inspected[i])]:[]);
 base.scene=['map','pangsa','teres','kebun','lab','sim0','sim1','sim2','sim3','workshop','flow','gate4'].includes(raw.scene)?raw.scene:'map';
 base.started=!!(raw.started||base.visited.length||base.answers.length||base.badges.length);base.summarySeen=!!raw.summarySeen;base.simulationSeen=!!raw.simulationSeen;
 base.drafts=raw.drafts&&typeof raw.drafts==='object'?raw.drafts:{};base.muted=!!raw.muted;
 for(const k of Object.keys(base.vol))if(Number.isFinite(raw.vol?.[k]))base.vol[k]=Math.max(0,Math.min(1,raw.vol[k]));return base;
}

function mountAssembly(root,placed,onPlace,feedback){

 let selected=null,start=null,dragged=false;const tray=root.querySelector('.parts-tray'),targets=root.querySelector('.targets');
 function choose(id){if(placed.includes(id))return;selected=id;root.querySelectorAll('[data-part]').forEach(b=>b.classList.toggle('selected',b.dataset.part===id));feedback('Dipilih: '+assemblyParts.find(p=>p.id===id).name+'. Letakkan pada ruang yang sesuai.');}
 function drop(target){if(!selected)return;if(selected!==target){feedback('Belum tepat. Perhatikan fungsi dan kedudukan komponen. Cuba lagi.');selected=null;return}placed.push(selected);onPlace(selected);selected=null;render();feedback('Betul! Komponen dipasang pada kedudukan yang sesuai.');}

else if(places.some(p=>p.id===next)){const p=places.find(p=>p.id===next);say(`${p.npc}: ${p.text}`,p.id);$('#objective').textContent='Misi 1 · '+p.topic;for(let i=0;i<2;i++)spot((state.visited.includes(p.id+i)?'✓ ':'')+p.items[i][0],i?71:25,i?49:73,()=>{if(!state.visited.includes(p.id+i))state.visited.push(p.id+i);unlock(p.id);go(p.id);say(`${p.npc}: ${p.items[i][1]}`,p.id+'-'+i)});btn('Kembali ke Bandar',()=>go('map'),'#controls','primary')}
else if(next==='lab'){say('Selamat datang ke Pusat Teknologi Pertanian! Periksa komponen empat sistem takungan. Bandingkan larutan yang statik dengan larutan yang dikitar semula.','lab');$('#objective').textContent='Misi 2 · Rahsia Sistem Takungan · Empat stesen interaktif';spot('Tanpa kitaran semula',27,76,()=>go('sim0'));spot('Dengan kitaran semula',72,76,()=>go('sim1'));spot('Akuaponik',25,40,()=>go('sim2'));spot('Bekas Pengairan Kendiri',72,40,()=>go('sim3'));btn('Makmal Tani Pintar',()=>go('workshop')).disabled=!state.badges.includes(2)&&state.mode!=='kelas';btn('Bandingkan Sistem',compare);btn('Jelaskan Dua Sistem',answer2);btn('Kembali ke Bandar',()=>{review=false;go('map')})}
else if(/^sim[0-3]$/.test(next)){const i=Number(next.at(-1)),s=systems[i];say(s.text,'system-'+i);$('#objective').textContent=s.name;const coords=[[[34,58],[67,37],[49,43],[68,76]],[[39,83],[18,52],[52,30],[77,62]],[[43,75],[20,46],[28,85],[65,27]],[[28,32],[72,32],[50,45],[50,65],[50,82],[84,64]]][i];s.parts.forEach((part,j)=>{const b=btn((state.inspected[i].includes(j)?'✓ ':'')+part[0],()=>{if(!review&&!state.inspected[i].includes(j))state.inspected[i].push(j);if(!review)unlock('system'+i);save();say(part[1],`system-${i}-${j}`);b.textContent='✓ '+part[0]},'#activity');b.dataset.component=j;});btn('Jeda',e=>{paused=!paused;$('#controls button').textContent=paused?'Mainkan':'Jeda'});btn('Ulang Animasi',()=>{simTime=0;paused=false;$('#controls button').textContent='Jeda'});btn('Bandingkan Sistem',compare);btn('Kembali ke Pusat',()=>go('lab'))}

function answer1(){if(state.visited.length<6){toast('Periksa dua objek di setiap tiga tempat dahulu.');return}if(!state.summarySeen){say('Kamu telah melihat pasu di balkoni, tanaman bertingkat dan kebun komuniti. Apakah persamaannya? Semuanya menghasilkan makanan dengan menggunakan ruang yang ada. '+definition,'definition');modal('<h2>Rumuskan bersama Alya</h2><p>'+definition+'</p><p>Ingat pemerhatian kamu: sawi di balkoni, susunan menegak di rumah teres, dan kebun komuniti di bandar. Bincangkan persamaan aktiviti ini sebelum menulis penerangan sendiri.</p><button id="understood">Saya sudah membuat rumusan</button>');$('#understood').onclick=()=>{state.summarySeen=true;unlock('definition');$('#modal').close();answer1()};return}answerForm('misi1','Terangkan maksud pertanian bandar dan berikan sekurang-kurangnya satu contoh yang sesuai.',()=>award(1,'lab'))}
function answerForm(id,prompt,done){const previous=state.answers.filter(a=>a.id===id).at(-1);modal(`<h2>Catatan Peneroka</h2><p>${prompt}</p>${state.mode==='kelas'?'<p>Guru: gunakan Lembaran Respons Individu. Catatan komputer ini ialah rekod perbincangan kelas sahaja.</p>':''}<label>Jawapan kamu<textarea id="answer" maxlength="5000">${esc(state.drafts[id]??previous?.text??'')}</textarea></label><p>Jawapan terbuka disimpan untuk pertimbangan guru. Lencana menunjukkan aktiviti selesai, bukan Tahap Penguasaan.</p><p id="answerError" role="alert"></p><button id="submitAnswer">Simpan Catatan</button>`);$('#answer').oninput=()=>{state.drafts[id]=$('#answer').value;save()};let submitted=false;$('#submitAnswer').onclick=()=>{if(submitted)return;const text=$('#answer').value.trim();if(!text){$('#answerError').textContent='Tulis penerangan kamu dahulu.';return}submitted=true;delete state.drafts[id];state.answers.push({id,text,time:Date.now(),mode:state.mode,attempt:state.answers.filter(a=>a.id===id).length+1});save();$('#modal').close();done()}}
function award(n,next){if(review)return;if(!state.badges.includes(n)){state.badges.push(n);state.stamps.push({mission:n,time:Date.now()})}state.scene=next;save();say('Tahniah! Kamu memperoleh lencana '+badgeNames[n-1]+'. Catatan kamu disimpan untuk semakan guru.','congrats-'+n);modal(`<div class="celebrate"><h2>Tahniah, peneroka!</h2><canvas id="stampAlya" width="80" height="96"></canvas><div class="badge">✦</div><h3>${badgeNames[n-1]}</h3><p>${state.badges.length}/5 lencana terkumpul</p><div class="stamp">SELESAI!</div><button id="nextMission">${n===1?'Terokai Pusat Teknologi':n===2?'Masuk Makmal Tani Pintar':'Lihat Pintu Misi 4'}</button></div>`);tone(880);setTimeout(()=>tone(180),1000);$('#nextMission').onclick=()=>{$('#modal').close();go(next)}}
function answer2(){if(review){toast('Mod ulang kaji tidak memberikan lencana. Sambung permainan untuk merekod kemajuan.');return}if(systems.some((s,i)=>state.inspected[i].length<s.parts.length)){toast('Periksa semua komponen di keempat-empat stesen dahulu.');return}modal('<h2>Jelaskan dua sistem</h2><p>Pilih dua sistem yang berbeza. Terangkan urutan pergerakan air serta fungsi komponen.</p>'+[0,1].map(n=>`<label>Sistem ${n+1}<select id="systemChoice${n}">${systems.map((s,i)=>`<option value="${i}" ${i===n?'selected':''}>${s.name}</option>`).join('')}</select></label><label>Penerangan ${n+1}<textarea id="explanation${n}"></textarea></label>`).join('')+'<p id="systemError" role="alert"></p><button id="saveSystems">Simpan Penerangan</button>');const draft=state.drafts.misi2;for(let n=0;n<2;n++){if(draft){$('#systemChoice'+n).value=draft.choices[n];$('#explanation'+n).value=draft.texts[n]}for(const id of ['systemChoice','explanation'])$('#'+id+n).oninput=()=>{state.drafts.misi2={choices:[0,1].map(i=>$('#systemChoice'+i).value),texts:[0,1].map(i=>$('#explanation'+i).value)};save()}}let submitted=false;$('#saveSystems').onclick=()=>{if(submitted)return;const choices=[0,1].map(n=>Number($('#systemChoice'+n).value)),texts=[0,1].map(n=>$('#explanation'+n).value.trim());if(choices[0]===choices[1]||texts.some(t=>!t)){$('#systemError').textContent='Pilih dua sistem berbeza dan lengkapkan kedua-dua penerangan.';return}submitted=true;delete state.drafts.misi2;state.answers.push({id:'misi2',text:choices.map((c,i)=>systems[c].name+': '+texts[i]).join('\n'),systems:choices,time:Date.now(),mode:state.mode,attempt:state.answers.filter(a=>a.id==='misi2').length+1});award(2,'workshop')}}
function compare(){modal(`<h2>Bandingkan Sistem</h2><div class="compare">${systems.map((s,i)=>`<article><h3>${s.name}</h3><p>${s.text}</p><p>${i===1||i===2?'Pam mengalirkan air dalam kitaran.':i===3?'Air naik melalui tindakan kapilari, tanpa pam.':'Larutan statik, tanpa pam kitaran.'}</p><button data-system="${i}">Lihat Animasi</button></article>`).join('')}</div><p>Bandingkan khususnya kultur air: tanpa kitaran menyimpan larutan statik, manakala dengan kitaran menggunakan pam dan salur kembali. Akuaponik melibatkan ikan dan mikroorganisma; bekas pengairan kendiri menggunakan tindakan kapilari.</p>`);document.querySelectorAll('[data-system]').forEach(b=>b.onclick=()=>{$('#modal').close();go('sim'+b.dataset.system)})}
function book(){modal(`<h2>Buku Misi Pertanian</h2><p>${state.badges.length}/5 lencana · Kemajuan disimpan pada pelayar ini sahaja.</p><h3>Koleksi Lencana</h3><p>${state.badges.length?state.badges.map(n=>'✦ '+badgeNames[n-1]+' · SELESAI!').join('<br>'):'Belum ada lencana.'}</p><h3>Nota Pertanian</h3>${state.notes.map(n=>`<article>${n==='definition'?definition:n.startsWith('system')?(systems[Number(n.at(-1))]?.text||''):places.find(p=>p.id===n)?.items.map(x=>x[1]).join(' ')||''}</article>`).join('')||'<p>Periksa objek untuk membuka nota.</p>'}<h3>Rekod Pembelajaran</h3><p>${state.answers.length} catatan · ${state.hints.length} penggunaan petunjuk</p>${state.answers.map(a=>`<article><b>${esc(a.id.replace('misi','Misi '))} · Cubaan ${a.attempt}</b><p>${esc(a.text)}</p></article>`).join('')}<p>Guru menilai ketepatan maksud, kesesuaian contoh, urutan aliran dan fungsi komponen. Terima penerangan setara yang munasabah; rekod ini tidak memberikan TP secara automatik.</p><button id="export">Eksport Rekod PBD</button><button id="replay">Ulang Kaji Animasi</button>`);$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='rekod-misi-pertanian.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#replay').onclick=()=>{$('#modal').close();review=true;go('lab')}}
function missionMenu(){modal('<h2>Pilih Misi / Main Semula</h2><p>Main semula mengekalkan lencana dan sejarah jawapan.</p><div id="missionButtons"></div><p>Misi 4 hanya mempunyai pintu masuk; Misi Akhir belum dibangunkan.</p>');[['Misi 1 · Misteri Pertanian Bandar','map'],['Misi 2 · Rahsia Sistem Takungan','lab'],['Misi 3 · Makmal Tani Pintar','workshop'],['Misi 4 · Pintu masuk','gate4']].forEach(([label,target],i)=>{const b=btn(label,()=>{$('#modal').close();review=false;go(target)},'#missionButtons');b.disabled=i>0&&!state.badges.includes(i)&&state.mode!=='kelas'})}
function settings(){modal(`<h2>Tetapan</h2><label>Mod permainan <select id="mode"><option value="kendiri">Mod Kendiri</option><option value="kelas">Mod Kelas</option></select></label><label><input id="mute" type="checkbox" ${state.muted?'checked':''}> Bisukan semua audio</label>${['voice','music','sfx'].map((x,i)=>`<label>${['Kelantangan suara','Kelantangan muzik latar','Kelantangan kesan bunyi'][i]}<input type="range" data-vol="${x}" min="0" max="1" step=".05" value="${state.vol[x]}"></label>`).join('')}<p>Suara: hanya ms-MY. Jika suara peranti atau rakaman tiada, sari kata kekal tersedia.</p><p>Mod Kelas membolehkan guru terus memilih tiga misi yang tersedia. Gunakan respons individu untuk PBD.</p><p>Cadangan 60 minit: induksi 5 · Misi 1: 8 · Misi 2: 14 · Misi 3: 10 · Misi 4: 8 · akhir: 10 · penutup: 5. Fasa 2 menyediakan Misi 1 hingga Misi 3.</p><p>${storageOK?'Simpanan pelayar tersedia.':'Simpanan pelayar tidak tersedia; eksport rekod sebelum keluar.'}</p>`);$('#mode').value=state.mode;$('#mode').onchange=e=>{save();state=profiles[e.target.value];review=false;save();$('#modal').close();go('home')};$('#mute').onchange=e=>{state.muted=e.target.checked;stopVoice();save()};document.querySelectorAll('[data-vol]').forEach(el=>el.oninput=()=>{state.vol[el.dataset.vol]=Number(el.value);if(musicGain)musicGain.gain.value=state.muted?0:state.vol.music*.08;save()})}
$('#home').onclick=()=>go('home');$('#book').onclick=book;$('#settings').onclick=settings;$('#close').onclick=()=>$('#modal').close();$('#listen').onclick=speak;
function frame(t){const delta=Math.min((t-last)/1000,.1);last=t;if(!paused)simTime+=delta;if(scene==='sim2')drawScience($('#world'),'aqua',simTime);else if(scene==='sim3'||scene==='flow')drawScience($('#world'),'self',simTime);else if(scene==='workshop')drawScience($('#world'),'self',0,state.assembly,true);else art.draw(scene,scene.startsWith('sim')?simTime:t/1000);if(scene==='flow'&&simTime>=6&&!flowCompleted){flowCompleted=true;state.simulationSeen=true;save();$('#explainLab').disabled=false;}if($('#stampAlya')){const stampArt=renderer($('#stampAlya'));stampArt.clear();stampArt.alya(40,50,t/1000,2.7,'stamp');}portrait.clear();portrait.alya(40,50,t/1000,2.7,talking?'talk':Math.floor(t/3000)%2?'wave':'idle');requestAnimationFrame(frame)}go('home');requestAnimationFrame(frame);
function workshop(){
 say('Makmal Tani Pintar: pasang tiga komponen pada bekas. A ialah penanda aras air, B ialah saluran mengisi air, C menghubungkan ruang air dengan medium. Seret komponen atau pilih komponen kemudian sentuh ruang.','workshop');$('#objective').textContent='Misi 3 · Pasang tiga komponen';
 $('#activity').innerHTML='<div id="assemblyBoard"></div><p id="assemblyFeedback" role="status">Pilih komponen dan letakkan pada ruang yang sesuai.</p><div id="cameraControls"></div><video id="camera" muted playsinline hidden></video><p id="cameraStatus" role="status">Tetikus / Sentuhan aktif. Kamera belum dihidupkan.</p>';
 // Board is over the cutaway; large targets use the same normalized coordinates.
 const board=$('#assemblyBoard');$('#stage').append(board);
 assemblyUI=mountAssembly(board,state.assembly,()=>{save();$('#runSimulation').disabled=state.assembly.length!==3},s=>$('#assemblyFeedback').textContent=s);

 btn('Pasang Semula',()=>{state.assembly=[];save();go('workshop')});btn('Kembali ke Pusat',()=>go('lab'));
 const status=s=>{if($('#cameraStatus'))$('#cameraStatus').textContent=s};
 btn('Kawalan Tangan',()=>{hands?.stop();$('#camera').hidden=false;hands=new HandControl($('#camera'),status,(x,y,phase)=>{if(!assemblyUI)return;if(phase==='lost'){assemblyUI.hide();return}const box=board.getBoundingClientRect();assemblyUI.hand(x*box.width,y*box.height,phase)});hands.start()},'#cameraControls');

 btn('Kalibrasi Semula',()=>hands?.detector?hands.calibrate():status('Hidupkan Kawalan Tangan dahulu.'),'#cameraControls');
 btn('Cuba Semula Kamera',()=>{if(hands)hands.start();else status('Pilih Kawalan Tangan untuk memberi kebenaran kamera.')},'#cameraControls');
}
function flowScene(){if(state.assembly.length!==3){go('workshop');return}flowCompleted=state.simulationSeen;$('#objective').textContent='Ruang air → partikel kapilari → medium → akar';say('Bahan kapilari bersentuhan dengan air. Air naik melalui bahan ini ke medium melalui tindakan kapilari, tanpa pam. Perhatikan perjalanan air sebelum menerangkan fungsinya.','capillary-flow');const pause=btn('Jeda',()=>{paused=!paused;pause.textContent=paused?'Mainkan':'Jeda'});btn('Ulang Animasi',()=>{simTime=0;paused=false;pause.textContent='Jeda'});const explain=btn('Jelaskan Tindakan Kapilari',()=>answerForm('misi3','1. Apakah fungsi ruang partikel kapilari? 2. Bagaimanakah air bergerak dari takungan ke medium tanaman?',()=>award(3,'gate4')));explain.id='explainLab';explain.disabled=!flowCompleted;btn('Periksa Semula Komponen',()=>go('workshop'))}
