const art=renderer($('#world')),portrait=renderer($('#portrait'));
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{storageOK=false;toast('Simpanan tidak tersedia. Eksport rekod sebelum keluar.')}}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',3500)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function btn(text,fn,parent='#controls',cls=''){const b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=()=>{tone();fn()};$(parent).append(b);return b}
function spot(text,x,y,fn){const b=btn(text,fn,'#spots','spot');b.style.left=x+'%';b.style.top=y+'%'}
function modal(html){$('#modalBody').innerHTML=html;if(!$('#modal').open)$('#modal').showModal()}
function stopVoice(){window.speechSynthesis?.cancel();if(audio){audio.pause();audio=null}talking=false;if(musicGain)musicGain.gain.value=state.muted?0:state.vol.music*.08}
function say(text,id=''){stopVoice();speech=text;speechID=id;$('#speech').textContent=text;$('#voiceStatus').textContent='Sari kata penuh tersedia.'}
function speak(){stopVoice();if(state.muted){toast('Audio dibisukan dalam Tetapan.');return}const voice=window.speechSynthesis?.getVoices().find(v=>/^ms[-_]MY$/i.test(v.lang));const fail=()=>{$('#voiceStatus').textContent='Rakaman ms-MY belum tersedia. Sila baca sari kata.';stopVoice()};talking=true;if(musicGain)musicGain.gain.value=state.vol.music*.02;if(voice){const u=new SpeechSynthesisUtterance(speech);u.voice=voice;u.lang='ms-MY';u.volume=state.vol.voice;u.onend=stopVoice;u.onerror=fail;speechSynthesis.speak(u);$('#voiceStatus').textContent='Suara ms-MY peranti; rakaman wanita disyorkan.'}else if(speechID){audio=new Audio('assets/audio/'+speechID+'.mp3');audio.volume=state.vol.voice;audio.onended=stopVoice;audio.onerror=fail;audio.play().catch(fail)}else fail()}
function tone(freq=620){if(state.muted)return;try{ctx??=new AudioContext();ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(state.vol.sfx*.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.15);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.16)}catch{}}
function music(){try{ctx??=new AudioContext();ctx.resume();if(musicGain)return;musicGain=ctx.createGain();musicGain.gain.value=state.muted?0:state.vol.music*.08;musicGain.connect(ctx.destination);[261.63,329.63,392].forEach(f=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;o.connect(musicGain);o.start()})}catch{}}
function unlock(id){if(!state.notes.includes(id))state.notes.push(id);save()}
function go(next){stopVoice();scene=next;paused=false;simTime=0;if(next!=='home'&&!review){state.scene=next;save()}$('#spots').replaceChildren();$('#controls').replaceChildren();$('#title').innerHTML='';$('#objective').textContent='';$('#status').textContent=`${state.mode==='kelas'?'Mod Kelas':'Mod Kendiri'} · ${state.badges.length}/5 lencana`;
if(next==='home'){review=false;$('#title').innerHTML='<span class="eyebrow">PENGEMBARAAN RBT • TAHUN 5</span><h1>Misi Pertanian<br>Bandar</h1><p>Jelajah Sistem Penanaman Secara Takungan</p>';$('#objective').textContent='Selamat datang ke Bandar Hijau · Fasa 1';say('Hai, saya Alya! Ruang rumah kita kecil, tetapi impian kebun kita besar. Mari bantu jiran meneroka pertanian bandar.','intro');btn('Mula Permainan',()=>{music();go('map')},'#controls','primary');btn('Sambung Permainan',()=>{music();go(state.scene||'map')});btn('Pilih Misi / Main Semula',missionMenu);btn('Buku Misi Pertanian',book);btn('Mod Ulang Kaji',()=>{review=true;go('lab')});btn('Tetapan',settings)}
else if(next==='map'){say('Jiran kita mahu menanam sayur, tetapi ruang rumah terhad. Terokai tiga tempat dan periksa dua objek di setiap tempat. Kemudian ceritakan penemuan kamu.','map');$('#objective').textContent=`Misi 1 · Misteri Pertanian Bandar · ${places.filter(p=>p.items.every((_,i)=>state.visited.includes(p.id+i))).length}/3 tempat diterokai`;spot('Rumah Pangsa',19,49,()=>go('pangsa'));spot('Rumah Teres',73,51,()=>go('teres'));spot('Kebun Komuniti',22,91,()=>go('kebun'));spot(state.badges.length?'Pusat Teknologi':'Pusat Teknologi · terkunci',72,91,()=>state.badges.length||state.mode==='kelas'?go('lab'):toast('Lengkapkan Misi 1 untuk membuka pusat teknologi.'));btn('Catat Penemuan',answer1,'#controls','primary');btn('Petunjuk',()=>{state.hints.push({mission:1,time:Date.now()});save();say(definition+' Contohnya, sawi ditanam dalam pasu di balkoni rumah pangsa.','definition')});btn('Pilih Misi',missionMenu)}
else if(places.some(p=>p.id===next)){const p=places.find(p=>p.id===next);say(`${p.npc}: ${p.text}`,p.id);$('#objective').textContent='Misi 1 · '+p.topic;for(let i=0;i<2;i++)spot((state.visited.includes(p.id+i)?'✓ ':'')+p.items[i][0],i?71:25,i?49:73,()=>{if(!state.visited.includes(p.id+i))state.visited.push(p.id+i);unlock(p.id);go(p.id);say(`${p.npc}: ${p.items[i][1]}`,p.id+'-'+i)});btn('Kembali ke Bandar',()=>go('map'),'#controls','primary')}
else if(next==='lab'){say('Selamat datang ke Pusat Teknologi Pertanian! Periksa komponen dua sistem kultur air. Bandingkan larutan yang statik dengan larutan yang dikitar semula.','lab');$('#objective').textContent='Misi 2 · Rahsia Sistem Takungan · Dua stesen Fasa 1';spot('Tanpa kitaran semula',27,76,()=>go('sim0'));spot('Dengan kitaran semula',72,76,()=>go('sim1'));btn('Bandingkan Sistem',compare);btn('Jelaskan Dua Sistem',answer2);btn('Kembali ke Bandar',()=>{review=false;go('map')})}
else if(/^sim[01]$/.test(next)){const i=Number(next.at(-1)),s=systems[i];say(s.text,'system-'+i);$('#objective').textContent=s.name;const coords=i?[[39,83],[18,52],[52,30],[77,62]]:[[34,58],[67,37],[49,43],[68,76]];s.parts.forEach((part,j)=>spot((state.inspected[i].includes(j)?'✓ ':'')+part[0],...coords[j],()=>{if(!state.inspected[i].includes(j))state.inspected[i].push(j);unlock('system'+i);save();say(part[1],`system-${i}-${j}`)}));btn('Jeda',e=>{paused=!paused;$('#controls button').textContent=paused?'Mainkan':'Jeda'});btn('Ulang Animasi',()=>{simTime=0;paused=false;$('#controls button').textContent='Jeda'});btn('Bandingkan Sistem',compare);btn('Kembali ke Pusat',()=>go('lab'))}}
function answer1(){if(state.visited.length<6){toast('Periksa dua objek di setiap tiga tempat dahulu.');return}unlock('definition');answerForm('misi1','Terangkan maksud pertanian bandar dan berikan sekurang-kurangnya satu contoh yang sesuai.',()=>{if(!state.badges.includes(1)){state.badges.push(1);state.stamps.push({mission:1,time:Date.now()});state.scene='lab';save();celebrate()}else{toast('Jawapan baharu disimpan. Lencana terdahulu kekal.');go('lab')}})}
function answerForm(id,prompt,done){const previous=state.answers.filter(a=>a.id===id).at(-1);modal(`<h2>Catatan Peneroka</h2><p>${prompt}</p>${state.mode==='kelas'?'<p>Guru: gunakan Lembaran Respons Individu. Catatan komputer ini ialah rekod perbincangan kelas sahaja.</p>':''}<label>Jawapan kamu<textarea id="answer" maxlength="5000">${esc(previous?.text||'')}</textarea></label><p>Jawapan terbuka disimpan untuk pertimbangan guru. Lencana menunjukkan aktiviti selesai, bukan Tahap Penguasaan.</p><p id="answerError" role="alert"></p><button id="submitAnswer">Simpan Catatan</button>`);$('#submitAnswer').onclick=()=>{const text=$('#answer').value.trim();if(!text){$('#answerError').textContent='Tulis penerangan kamu dahulu.';return}state.answers.push({id,text,time:Date.now(),mode:state.mode,attempt:state.answers.filter(a=>a.id===id).length+1});save();$('#modal').close();done()}}
function celebrate(){say('Tahniah! Kamu telah meneroka tiga kawasan dan mencatat penemuan. Kamu kini Peneroka Pertanian Bandar!','congrats');modal('<div class="celebrate"><h2>Tahniah, peneroka!</h2><div class="badge">✦</div><h3>Peneroka Pertanian Bandar</h3><p>Lencana 1 daripada 5</p><div class="stamp">SELESAI!</div><p>Pusat Teknologi Pertanian dibuka!</p><button id="nextMission">Terokai Pusat Teknologi</button></div>');tone(880);setTimeout(()=>tone(180),1000);$('#nextMission').onclick=()=>{$('#modal').close();go('lab')}}
function answer2(){if(state.inspected.some(p=>p.length<4)){toast('Periksa empat komponen di kedua-dua stesen dahulu.');return}answerForm('misi2','Jelaskan cara berfungsi kedua-dua sistem kultur air. Bagaimanakah peranan pam dan pergerakan larutan berbeza?',()=>{toast('Penerangan disimpan. Dua stesen seterusnya akan hadir dalam Fasa 2.');go('lab')})}
function compare(){modal(`<h2>Bandingkan Sistem</h2><div class="compare">${systems.map((s,i)=>`<article><h3>${s.name}</h3><p>${s.text}</p><p>${i?'Pam diperlukan untuk kitaran larutan.':'Tiada pam untuk kitaran larutan.'}</p><button data-system="${i}">Lihat Animasi</button></article>`).join('')}</div><p>Kedua-duanya membekalkan air dan nutrien kepada akar tanpa tanah.</p>`);document.querySelectorAll('[data-system]').forEach(b=>b.onclick=()=>{$('#modal').close();go('sim'+b.dataset.system)})}
function book(){modal(`<h2>Buku Misi Pertanian</h2><p>${state.badges.length}/5 lencana · Kemajuan disimpan pada pelayar ini sahaja.</p><h3>Koleksi Lencana</h3><p>${state.badges.includes(1)?'✦ Peneroka Pertanian Bandar · SELESAI!':'Belum ada lencana. Terokai bandar bersama Alya.'}</p><h3>Nota Pertanian</h3>${state.notes.map(n=>`<article>${n==='definition'?definition:n.startsWith('system')?systems[Number(n.at(-1))].text:places.find(p=>p.id===n)?.items.map(x=>x[1]).join(' ')||''}</article>`).join('')||'<p>Periksa objek untuk membuka nota.</p>'}<h3>Rekod Pembelajaran</h3><p>${state.answers.length} catatan · ${state.hints.length} penggunaan petunjuk</p>${state.answers.map(a=>`<article><b>${a.id==='misi1'?'Misi 1':'Misi 2'} · Cubaan ${a.attempt}</b><p>${esc(a.text)}</p></article>`).join('')}<p>Guru menilai ketepatan maksud, kesesuaian contoh, urutan aliran dan fungsi komponen. Terima penerangan setara yang munasabah; rekod ini tidak memberikan TP secara automatik.</p><button id="export">Eksport Rekod PBD</button><button id="replay">Ulang Kaji Animasi</button>`);$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='rekod-misi-pertanian.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#replay').onclick=()=>{$('#modal').close();review=true;go('lab')}}
function missionMenu(){modal('<h2>Pilih Misi / Main Semula</h2><p>Main semula mengekalkan lencana dan sejarah jawapan.</p><div id="missionButtons"></div><p>Misi 3, Misi 4 dan Misi Akhir belum tersedia dalam Fasa 1.</p>');btn('Misi 1 · Misteri Pertanian Bandar',()=>{$('#modal').close();go('map')},'#missionButtons');const b=btn('Misi 2 · Dua Stesen Kultur Air',()=>{$('#modal').close();go('lab')},'#missionButtons');b.disabled=!state.badges.includes(1)&&state.mode!=='kelas'}
function settings(){modal(`<h2>Tetapan</h2><label>Mod permainan <select id="mode"><option value="kendiri">Mod Kendiri</option><option value="kelas">Mod Kelas</option></select></label><label><input id="mute" type="checkbox" ${state.muted?'checked':''}> Bisukan semua audio</label>${['voice','music','sfx'].map((x,i)=>`<label>${['Kelantangan suara','Kelantangan muzik latar','Kelantangan kesan bunyi'][i]}<input type="range" data-vol="${x}" min="0" max="1" step=".05" value="${state.vol[x]}"></label>`).join('')}<p>Suara: hanya ms-MY. Jika suara peranti atau rakaman tiada, sari kata kekal tersedia.</p><p>Mod Kelas membolehkan guru terus memilih dua misi yang tersedia. Gunakan respons individu untuk PBD.</p><p>Cadangan 60 minit: induksi 5 · Misi 1: 8 · Misi 2: 14 · Misi 3: 10 · Misi 4: 8 · akhir: 10 · penutup: 5. Fasa 1 hanya menyediakan Misi 1 dan dua stesen Misi 2.</p><p>${storageOK?'Simpanan pelayar tersedia.':'Simpanan pelayar tidak tersedia; eksport rekod sebelum keluar.'}</p>`);$('#mode').value=state.mode;$('#mode').onchange=e=>{state.mode=e.target.value;save();$('#status').textContent=state.mode==='kelas'?'Mod Kelas':'Mod Kendiri'};$('#mute').onchange=e=>{state.muted=e.target.checked;stopVoice();save()};document.querySelectorAll('[data-vol]').forEach(el=>el.oninput=()=>{state.vol[el.dataset.vol]=Number(el.value);if(musicGain)musicGain.gain.value=state.muted?0:state.vol.music*.08;save()})}
$('#home').onclick=()=>go('home');$('#book').onclick=book;$('#settings').onclick=settings;$('#close').onclick=()=>$('#modal').close();$('#listen').onclick=speak;
function frame(t){const delta=Math.min((t-last)/1000,.1);last=t;if(!paused)simTime+=delta;art.draw(scene,scene.startsWith('sim')?simTime:t/1000);portrait.clear();portrait.alya(40,50,t/1000,2.7,talking?'talk':Math.floor(t/3000)%2?'wave':'idle');requestAnimationFrame(frame)}go('home');requestAnimationFrame(frame);
</script></body></html>
